name: Build Aesthetic Jobs

on:
  push:
    branches: [main, master]
    paths:
      - "aestheticjobs_mod.zip"
      - "tools/assemble.sh"
      - ".github/workflows/build.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      - name: Unpack the archive and assemble the project
        run: bash tools/assemble.sh aestheticjobs_mod.zip build_project
        env:
          MOD_AUTHORS: ${{ vars.MOD_AUTHORS }}
      - name: Build the jar
        working-directory: build_project
        run: ./gradlew build --no-daemon --no-configuration-cache --stacktrace
      - name: Upload the jar
        uses: actions/upload-artifact@v4
        with:
          name: aestheticjobs-jar
          path: build_project/build/libs/*.jar
          if-no-files-found: error
